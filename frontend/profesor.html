<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profesor - Mario Kart Lector</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="screen-profesor">

  <!-- Banner superior -->
  <header class="banner game-banner">
    <img src="assets/profesor/banner.png" alt="Mario Kart Lector">
  </header>

  <!-- Contenido principal -->
  <main class="main-container">

    <section class="page-hero">
      <div class="hero-copy">
        <p class="screen-kicker">Panel profesor</p>
        <h1>Gran Premio de Lectura</h1>
        <p class="screen-subtitle">Sigue el avance de la clase, revisa el ranking y gestiona el curso lector.</p>
      </div>
      <img src="assets/profesor/profe.png" alt="Profesor">
    </section>

    <!-- Panel del circuito -->
    <section class="panel panel-circuito">

      <div class="hud-grid">
        <div class="hud-item">
          <span class="hud-label">Curso activo</span>
          <strong>5ºD Primaria</strong>
        </div>
        <div class="hud-item">
          <span class="hud-label">Objetivo</span>
          <strong>Leer, avanzar y celebrar</strong>
        </div>
      </div>

      <!-- Circuito -->
      <div id="circuito-container">
        <img src="assets/circuitos/circuito1.png" alt="Circuito" id="circuito">
        <div id="coches-container"></div>
      </div>

      <!-- Ranking -->
      <div class="panel panel-ranking">

        <div class="section-title">
          <span class="title-badge">P1</span>
          <h2>Ranking de lectura</h2>
        </div>

        <ol id="rankingLista" class="ranking-lista"></ol>

      </div>

      <br>
      <br>

      <!-- Botones profesor -->
      <div class="botones-profesor">

        <a href="alumnos.html" class="button-link">
          <button type="button" class="btn-primary">Gestionar alumnos</button>
        </a>

        <button type="button" id="logoutBtn" class="btn-secondary">
          Cerrar sesión
        </button>

      </div>

    </section>

  </main>

  <!-- Scripts -->
  <script type="module" src="js/circuito.js"></script>
  <script type="module" src="js/profesor.js"></script>

</body>
</html>
