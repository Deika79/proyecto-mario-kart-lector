<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión de alumnos</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body class="screen-admin">

<header class="banner game-banner">
<img src="assets/profesor/banner.png" alt="Mario Kart Lector">
</header>

<main class="main-container">

<section class="page-hero">
<div class="hero-copy">
<p class="screen-kicker">Panel profesor</p>
<h1>Gestión del curso</h1>
<p class="screen-subtitle">Alta de alumnos, accesos familiares y cambio de curso sin perder el histórico.</p>
</div>
<img src="assets/profesor/profe.png" alt="Profesor">
</section>

<section class="panel admin-panel">

<!-- ===== ALUMNOS ACTUALES ===== -->

<div class="section-title">
<span class="title-badge">01</span>
<h2>Alumnos actuales</h2>
</div>
<ul id="listaAlumnos"></ul>

<hr>

<!-- ===== NUEVO ALUMNO ===== -->

<div class="section-title">
<span class="title-badge">02</span>
<h2>Nuevo alumno</h2>
</div>

<form id="crearAlumnoForm">

<label>Nombre alumno</label>
<input type="text" id="nombreAlumno" required>

<label>Coche</label>
<select id="cocheAlumno">

<option value="coche1">Coche rojo</option>
<option value="coche2">Coche verde</option>
<option value="coche3">Coche azul</option>
<option value="coche4">Coche amarillo</option>

<option value="coche5">Coche negro</option>
<option value="coche6">Coche rosa</option>
<option value="coche7">Coche naranja</option>
<option value="coche8">Coche morado</option>

</select>

<button type="submit" class="btn-primary">Crear alumno</button>

</form>

<p id="mensajeCrear" class="form-message"></p>

<hr>

<!-- ===== REINICIAR CURSO ===== -->

<div class="section-title">
<span class="title-badge">03</span>
<h2>Cambio de curso</h2>
</div>

<label>Nombre del archivo</label>
<input type="text" id="nombreCursoArchivo" value="5ºD Primaria">

<button id="archivarReiniciarBtn" class="btn-primary">
Archivar curso y poner puntos a cero
</button>

<p id="mensajeArchivo" class="form-message"></p>

<div class="section-title compact-title">
<span class="title-badge">BOX</span>
<h2>Cursos archivados</h2>
</div>
<ul id="listaArchivos"></ul>

<hr>

<div class="section-title danger-title">
<span class="title-badge">!</span>
<h2>Zona peligrosa</h2>
</div>

<button id="resetClaseBtn" class="boton-peligro">
Reiniciar clase borrando alumnos y padres
</button>

<br><br>

<button id="volverBtn" class="btn-secondary">Volver al panel</button>

</section>

</main>

<!-- MODAL CREAR PADRE -->

<div id="modalPadre" class="modal-backdrop" style="display:none;">

<div class="modal-card">

<h3>Crear acceso familiar</h3>

<form id="crearPadreForm">

<input type="hidden" id="padreAlumnoId">

<label>Nombre padre</label>
<input type="text" id="padreNombre" required>

<label>Email</label>
<input type="email" id="padreEmail" required>

<label>Password</label>
<input type="text" id="padrePassword" readonly>

<br>

<button type="button" id="generarPasswordBtn" class="btn-secondary">
Generar nueva contraseña
</button>

<p id="passwordGenerada" class="form-message"></p>

<button type="button" id="copiarPasswordBtn" class="btn-secondary">
Copiar contraseña
</button>

<br><br>

<button type="submit" class="btn-primary">Crear usuario</button>

<button type="button" id="cancelarPadre" class="btn-secondary">Cancelar</button>

</form>

<p id="mensajePadre" class="form-message"></p>

</div>

</div>

<script type="module" src="js/alumnos.js"></script>

</body>
</html>
