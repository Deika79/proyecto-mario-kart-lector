<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Familia - Mario Kart Lector</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="screen-familia">

  <header class="banner game-banner">
    <img src="assets/profesor/banner.png" alt="Mario Kart Lector">
  </header>

  <main class="main-container">

  <section class="panel familia-panel">
    <div class="section-title">
      <span class="title-badge">GO</span>
      <h1>Registrar lectura</h1>
    </div>

  <div class="form-container">
    <form id="registroForm">

      <label for="alumnoId">Piloto lector</label>
      <select id="alumnoId" required></select>

      <label for="minutos">Minutos leídos hoy</label>
      <input type="number" id="minutos" min="1" required>

      <div class="button-row">
        <button type="submit" class="btn-primary">Registrar minutos</button>
        <button type="button" id="logoutBtn" class="btn-secondary">Cerrar sesión</button>
      </div>

    </form>
  </div>

  <div id="mensaje" class="form-message"></div>
  </section>

  <!-- CIRCUITO FAMILIA -->

  <section class="panel panel-circuito panel-circuito-familia">
    <div class="section-title">
      <span class="title-badge">MAP</span>
      <h2>Circuito lector</h2>
    </div>

    <div class="family-circuit-note">
      <span>Tu familia aparece resaltada en pista.</span>
    </div>

    <div id="circuito-container">
      <img src="assets/circuitos/circuito1.png" alt="Circuito" id="circuito">
      <div id="coches-container"></div>
    </div>
  </section>

  <!-- RANKING -->

  <div class="panel panel-ranking">
    <div class="section-title">
      <span class="title-badge">P1</span>
      <h2>Ranking de lectura</h2>
    </div>
    <ol id="rankingLista" class="ranking-lista"></ol>
  </div>

  <!-- 🆕 HISTORIAL -->

  <div class="panel panel-history">
    <div class="section-title">
      <span class="title-badge">LOG</span>
      <h2>Últimos registros</h2>
    </div>
    <ul id="listaRegistros"></ul>
  </div>

  </main>

  <script type="module" src="js/padre.js"></script>

</body>
</html>
